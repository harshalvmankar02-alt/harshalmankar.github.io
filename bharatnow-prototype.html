    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        .hover-scale {
            transition: transform 0.3s ease;
        }
        .hover-scale:hover {
            transform: translateY(-8px);
        }
    </style>
</head>

        // App State
        let darkMode = false;
        let currentCategory = 'all';
        let mobileMenuOpen = false;

        // Utility Functions
        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            
            if (diffMins < 60) return `${diffMins} minutes ago`;
            if (diffHours < 24) return `${diffHours} hours ago`;
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        function getCurrentDate() {
            return new Date().toLocaleDateString('en-IN', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // Components
        function NewsCard({ article, featured = false }) {
            return `

                            alt="${article.title}"
                            class="w-full ${featured ? 'h-96' : 'h-48'} object-cover"
                        />

                            <span class="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-semibold uppercase">
                                ${article.category}
                            </span>
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="${featured ? 'text-2xl' : 'text-lg'} font-bold mb-2 text-gray-900 dark:text-white line-clamp-2 hover:text-red-600 cursor-pointer">

                        </h3>
                        <p class="text-gray-600 dark:text-gray-300 mb-3 line-clamp-3">
                            ${article.description}
                        </p>
                        <div class="flex items-center justify-between text-sm mb-4">
                            <div class="flex items-center gap-2">
                                <span class="text-gray-500 dark:text-gray-400 font-medium">
                                    ${article.source}
                                </span>
                                <span class="text-gray-400 dark:text-gray-500">•</span>
                                <span class="text-gray-500 dark:text-gray-400">
                                    ${formatTime(article.publishedAt)}
                                </span>
                            </div>
                            <button class="text-red-600 hover:text-red-700" onclick="shareArticle('${article.title}')">

                        <div class="bg-gray-300 dark:bg-gray-700 h-4 rounded w-1/2"></div>
                    </div>
                </div>
            `;
        }

        // Event Handlers
        function toggleDarkMode() {
            darkMode = !darkMode;
            document.documentElement.classList.toggle('dark');
            render();

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            render();
        }

        function changeCategory(category) {
            currentCategory = category;
            mobileMenuOpen = false;
            render();
        }

        function shareArticle(title) {
            if (navigator.share) {
                navigator.share({ title: title });
            } else {
                alert('Share: ' + title);
            }
        }

        function subscribeNewsletter(e) {
            e.preventDefault();
            const email = document.getElementById('newsletter-email').value;
            alert(`✓ Thank you for subscribing!\nWe'll send updates to ${email}`);
            document.getElementById('newsletter-email').value = '';
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value;
            alert(`Searching for: ${query}`);
        }
